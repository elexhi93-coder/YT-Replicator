{% extends "base.html" %}
{% block title %}Download Profiles — project003{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-white">Download Profiles</h1>
  <span class="text-xs" style="color: var(--text-muted);">
    Per-pipeline yt-dlp settings: resolution, format, subtitles, thumbnails, skip rules.
  </span>
</div>

<div class="mb-4">
  <button hx-get="/partials/profiles/new"
          hx-target="#profile-form-slot"
          hx-swap="innerHTML"
          class="px-4 py-1.5 text-sm rounded font-medium"
          style="background: #238636; color: white;">+ New Profile</button>
</div>

<div id="profile-form-slot" class="mb-6"></div>

<div id="profiles-panel"
     hx-get="/partials/profiles/list"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="text-sm italic" style="color: var(--text-muted);">Loading profiles…</div>
</div>
{% endblock %}
