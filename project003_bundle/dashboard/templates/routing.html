{% extends "base.html" %}
{% block title %}Routing — project003{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-white">Routing Matrix</h1>
  <span class="text-xs" style="color: var(--text-muted);">
    Each cell is a (source → destination) routing rule. Click a cell to edit, add filters, or test.
  </span>
</div>

<div id="routing-matrix"
     hx-get="/partials/routing/matrix"
     hx-trigger="load"
     hx-swap="innerHTML">
  <div class="text-sm italic" style="color: var(--text-muted);">Loading matrix…</div>
</div>

<div id="rule-panel" class="mt-6"></div>
{% endblock %}
