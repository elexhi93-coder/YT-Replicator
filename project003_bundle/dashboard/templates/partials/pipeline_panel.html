{# partials/pipeline_panel.html — expanded panel for a pipeline. Expects: pid #}
<div class="px-4 pt-3 flex items-center justify-between">
  <a href="/downloads?pipeline_id={{ pid }}"
     class="text-xs px-2 py-1 rounded"
     style="background: #122b40; color: #58a6ff; border: 1px solid #1f4a6e;"
     title="Open Downloads tab filtered to this pipeline">⤓ View in Downloads</a>
</div>
<div class="px-4 pt-4">
  <h3 class="text-sm font-semibold text-white mb-2 uppercase tracking-wide">Download profile</h3>
  <div hx-get="/partials/pipelines/{{ pid }}/download_profile"
       hx-trigger="load"
       hx-swap="innerHTML">
    <p class="text-xs" style="color: #8b949e;">Loading…</p>
  </div>
</div>
<div class="grid md:grid-cols-2 gap-4 p-4">
  <div>
    <h3 class="text-sm font-semibold text-white mb-2 uppercase tracking-wide">Channels</h3>
    <div id="channel-list-{{ pid }}"
         hx-get="/partials/pipelines/{{ pid }}/channels"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p class="text-xs" style="color: #8b949e;">Loading…</p>
    </div>
  </div>
  <div>
    <h3 class="text-sm font-semibold text-white mb-2 uppercase tracking-wide">Destinations</h3>
    <div id="destination-list-{{ pid }}"
         hx-get="/partials/pipelines/{{ pid }}/destinations"
         hx-trigger="load"
         hx-swap="innerHTML">
      <p class="text-xs" style="color: #8b949e;">Loading…</p>
    </div>
  </div>
</div>
